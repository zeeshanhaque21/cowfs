name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  linux-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3
          python3 -c 'import os; os.close(os.open("/dev/fuse", os.O_RDWR))'
          fusermount3 --version
      - name: Test FUSE mounts and conformance
        env:
          COWFS_FUSE_STRICT: "1"
          COWFS_CONFORMANCE_XATTR_NAMES: prefixed
        run: cargo test -p cowfs-fuse -j4 -- --include-ignored --test-threads=1 --nocapture
      - name: Native xattr control
        if: failure()
        env:
          COWFS_CONFORMANCE_FILTER: xattr_on_directory_and_symlink
        run: cargo test -p cowfs-vfs-path --test native -j4 -- --ignored --nocapture --test-threads=1
