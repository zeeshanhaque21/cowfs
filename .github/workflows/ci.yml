name: ci

# A change that touches only documentation or the progress tracker does not start CI. No test reads a
# doc: the generated lock-audit table in docs/v1-core.md is checked by scripts/lock_audit.py --check in
# the lint job, which runs whenever source changes. A change that touches any other file as well still
# runs everything, and so does an edit of this workflow file. A pull request that only touches the paths
# below gets no CI run at all, not a skipped one.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'progress/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'progress/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  # fmt and clippy run beside the test shards, not before them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          # Restore only. The test shards own the cache entry.
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lock-audit table in docs/v1-core.md is current
        run: python3 scripts/lock_audit.py --check
      - name: Bench harness unit tests (ubuntu)
        run: python3 -m unittest discover -s bench -v

  # The 170 test binaries ran one after another in a single job (about 740 s of the 780 s test
  # step; compile was already cached). nextest runs the tests of every binary in one pool, and
  # --partition splits the whole set over parallel runners.
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce (a handful run at once across every open PR). Three macOS shards
        # waited up to 480 s for a runner in the first run, so macOS stays one nextest job (and carries
        # the macOS bench unit tests), and only ubuntu is sharded.
        include:
          - { os: ubuntu-latest, shard: 1, of: 2 }
          - { os: ubuntu-latest, shard: 2, of: 2 }
          - { os: macos-latest, shard: 1, of: 1 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Same key as the old single job, so PR runs restore main's existing cache.
          shared-key: check
          # Only main writes the cache, and only one shard of it. PR runs restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --profile ci --partition hash:${{ matrix.shard }}/${{ matrix.of }}
      # nextest does not run doctests.
      - name: Doctests
        if: ${{ matrix.shard == 1 }}
        run: cargo test --doc --workspace
      - name: Bench harness unit tests (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        run: python3 -m unittest discover -s bench -v

  # Issue 173: the fault-injection seam must not be in a normal release build. Two release builds, so
  # it runs beside the tests, not inside lint.
  fault-seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          # Restore only. The test shards own the cache entry.
          save-if: false
      - name: Fault-injection seam is absent without its feature (issue 173)
        run: scripts/check-fault-seam-absent.sh

  # One name to require: fails unless lint, fault-seam and every test shard passed.
  check:
    needs: [lint, fault-seam, test]
    # Not always(): a superseded PR run is cancelled, and must not start a check that then fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint=${{ needs.lint.result }} fault-seam=${{ needs.fault-seam.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.fault-seam.result }}" = success
          test "${{ needs.test.result }}" = success

  # Issue 171: the namespace isolation tests skip on a host that denies unprivileged user namespaces.
  # ubuntu-24.04 does (kernel.apparmor_restrict_unprivileged_userns=1, measured on the runner), so
  # this job lifts that one sysctl and then refuses to go green unless the isolation tests ran.
  linux-namespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --propagation private -- true
      - name: Namespace tests
        shell: bash  # bash -e -o pipefail, so a failing test fails the step through the tee
        run: python3 -m unittest discover -s bench -p test_namespaces.py -v 2>&1 | tee namespaces.log
      - name: Enforce that isolation ran, not skipped
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("namespaces.log").read_text()
          assert "a mount namespace was available" in log, "helper reported no namespace: isolation skipped"
          ran = re.findall(r"^(test_\w+) \(test_namespaces\.Isolation\.\w+\) \.\.\. ok$", log, re.MULTILINE)
          assert len(ran) == 9, f"expected 9 isolation tests to pass, saw {len(ran)}: {ran}"
          assert re.search(r"^Ran 17 tests", log, re.MULTILINE), "test count changed: update this gate"
          assert re.search(r"^OK \(skipped=1\)$", log, re.MULTILINE), "namespace run was not a clean pass"
          skipped = re.findall(r"^(test_\w+) .*\.\.\. skipped", log, re.MULTILINE)
          assert skipped == ["test_off_linux_is_unmeasurable"], f"unexpected skips: {skipped}"
          print("::notice::namespace isolation tests ran and passed: " + ", ".join(sorted(ran)))
          PY

  linux-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache. PR runs restore main's, so they never evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install FUSE
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3
          python3 -c 'import os; os.close(os.open("/dev/fuse", os.O_RDWR))'
          fusermount3 --version
      - name: Native xattr control
        env:
          COWFS_CONFORMANCE_FILTER: xattr_on_directory_and_symlink
        run: cargo test -p cowfs-vfs-path --test native -j4 -- --ignored --nocapture --test-threads=1 2>&1 | tee native-xattr.log
      - name: Native page-cache control
        env:
          COWFS_CONFORMANCE_FILTER: concurrent_readers_and_writers_of_one_file
        run: cargo test -p cowfs-vfs-path --test native -j4 -- --ignored --nocapture --test-threads=1 2>&1 | tee native-page-cache.log || true
      - name: Native forget control
        env:
          COWFS_CONFORMANCE_FILTER: statfs_free_after_unlink
          # tmpfs, not the runner's disk: this check asserts blocks_free returns exactly, which a
          # filesystem sharing free space with the rest of the machine cannot promise.
          COWFS_PATHVFS_NATIVE_DIR: /dev/shm/cowfs-native-control
        run: |
          mkdir -p /dev/shm/cowfs-native-control
          cargo test -p cowfs-vfs-path --test native -j4 -- --ignored --nocapture --test-threads=1 2>&1 | tee native-forget.log
      - name: Test FUSE mounts and conformance
        env:
          COWFS_CONFORMANCE_XATTR_NAMES: prefixed
        run: cargo test -p cowfs-fuse -j4 -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee fuse-tests.log
      - name: Enforce conformance results
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path("fuse-tests.log").read_text()
          control = Path("native-xattr.log").read_text()
          page_cache = Path("native-page-cache.log").read_text()
          forget_control = Path("native-forget.log").read_text()
          failures = re.findall(r"^FAIL\s+.*$", log, re.MULTILINE)
          known = r"^FAIL\s+cowfs\s+xattrs\s+xattr_on_directory_and_symlink\s+.*unexpected error: permission denied \(PermissionDenied\)$"
          unexpected = [line for line in failures if not re.fullmatch(known, line)]
          # The expected counts come from the check list itself, so adding a check or unskipping one
          # needs no number edited here: every check is run, skipped by name, heavy or above level.
          checks = re.findall(
              r"^\s+\((\w+), (\w+), (?:Posix|Portable|Cowfs)\),\s*$",
              Path("crates/cowfs-vfs-test/src/conformance/list.rs").read_text(),
              re.MULTILINE,
          )
          reports = re.findall(
              r"^(\d+) run, (\d+) failed, (\d+) skipped, (\d+) heavy not enabled, (\d+) above the level",
              log,
              re.MULTILINE,
          )
          report = max(reports, key=lambda r: int(r[0]), default=None)
          assert report and int(report[0]) + int(report[2]) + int(report[3]) + int(report[4]) == len(checks), (
              f"Conformance report does not account for all {len(checks)} checks: {report}"
          )
          # Skips are an explicit list; the fallocate checks must never be among them.
          skipped = set(re.findall(r"^SKIP\s+\S+\s+\S+\s+(\w+)", log, re.MULTILINE))
          expected_skips = {
              "concurrent_readers_and_writers_of_one_file",
              "statfs_free_after_unlink",
              "hardlink_limit_reports_too_many_links",
          } | {name for module, name in (c[:2] for c in checks) if module == "special"}
          assert skipped == expected_skips, f"Skipped checks differ: extra {sorted(skipped - expected_skips)}, missing {sorted(expected_skips - skipped)}"
          assert "SKIP: /dev/fuse" not in log, "FUSE tests skipped"
          assert not unexpected, "Unexpected conformance failures:\n" + "\n".join(unexpected)
          if failures:
              assert len(failures) == 1 and re.search(known, control, re.MULTILINE), "Native control did not reproduce the known failure"
              reason = "Known failing: xattr_on_directory_and_symlink - Linux denies user xattrs on symlinks, reproduced by native control."
              print("::warning::" + reason)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(reason + "\n")
          # concurrent_readers_and_writers_of_one_file asserts a cowfs contract the kernel page cache
          # breaks, so it is gated as a known native-kernel limit rather than skipped silently: the
          # FUSE harness skips it with a reason (issue #45) and the native control in this job runs
          # the identical test body on the runner's own filesystem.
          assert re.search(
              r"^SKIP\s+cowfs\s+concurrency\s+concurrent_readers_and_writers_of_one_file\s+.*page cache",
              log,
              re.MULTILINE,
          ), "Page-cache-limited check was not gated with a reason"
          assert re.search(
              r"^1 run,", page_cache, re.MULTILINE
          ), "Native page-cache control did not run the check"
          torn = bool(re.search(r"torn read at offset", page_cache))
          reason = (
              "Known native-kernel limit: concurrent_readers_and_writers_of_one_file - the page cache "
              "serves buffered reads while a page-splitting write is in flight, so native ext4 tears "
              + ("too on this runner (reproduced by the native control)." if torn else "only intermittently (not reproduced in this single control run; measured 72/200 on btrfs and 29/200 on tmpfs, see issue #45).")
          )
          print("::warning::" + reason)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(reason + "\n")
          # statfs_free_after_unlink asserts reclaim is visible in the same call as forget. The
          # kernel owns the reference lifetime and sends FORGET on its own schedule, so through a
          # mount the reclaim is late by a few hundred microseconds. Native PathVfs, whose forget is
          # synchronous, passes, which is what proves MemVfs reclaims on forget as the trait requires
          # (issue #45). The control runs here with the opposite polarity: it must PASS.
          assert re.search(
              r"^SKIP\s+cowfs\s+basic\s+statfs_free_after_unlink\s+.*FORGET",
              log,
              re.MULTILINE,
          ), "Async-forget-limited check was not gated with a reason"
          assert re.search(
              r"^1 run, 0 failed,", forget_control, re.MULTILINE
          ), "Native forget control did not pass: MemVfs does not reclaim synchronously on forget"
          reason = (
              "Gated: statfs_free_after_unlink - the kernel sends FORGET asynchronously, so reclaim "
              "is not visible in the same call through a mount. The native control in this job, whose "
              "forget is synchronous, passed, confirming MemVfs reclaims on forget (issue #45)."
          )
          print("::warning::" + reason)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(reason + "\n")
          PY
