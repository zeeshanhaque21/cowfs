name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  linux-fuse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3
          python3 -c 'import os; os.close(os.open("/dev/fuse", os.O_RDWR))'
          fusermount3 --version
      - name: Native xattr control
        env:
          COWFS_CONFORMANCE_FILTER: xattr_on_directory_and_symlink
        run: cargo test -p cowfs-vfs-path --test native -j4 -- --ignored --nocapture --test-threads=1 2>&1 | tee native-xattr.log
      - name: Test FUSE mounts and conformance
        env:
          COWFS_CONFORMANCE_XATTR_NAMES: prefixed
        run: cargo test -p cowfs-fuse -j4 -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee fuse-tests.log
      - name: Enforce conformance results
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path("fuse-tests.log").read_text()
          control = Path("native-xattr.log").read_text()
          failures = re.findall(r"^FAIL\s+.*$", log, re.MULTILINE)
          known = r"^FAIL\s+cowfs\s+xattrs\s+xattr_on_directory_and_symlink\s+.*unexpected error: permission denied \(PermissionDenied\)$"
          unexpected = [line for line in failures if not re.fullmatch(known, line)]
          assert re.search(r"^129 run,", log, re.MULTILINE), "Missing full conformance report"
          assert "SKIP: /dev/fuse" not in log, "FUSE tests skipped"
          assert not unexpected, "Unexpected conformance failures:\n" + "\n".join(unexpected)
          if failures:
              assert len(failures) == 1 and re.search(known, control, re.MULTILINE), "Native control did not reproduce the known failure"
              reason = "Known failing: xattr_on_directory_and_symlink - Linux denies user xattrs on symlinks, reproduced by native control."
              print("::warning::" + reason)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(reason + "\n")
          PY
