[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# Retries stay at nextest's default of 0: a test that passes only on a second try is a flake to fix.

# cowfs-ctl measures shutdown windows and grace periods against wall-clock bounds (issues 77, 121,
# 128, 166), so each of its tests runs alone on the runner. Measured cost on macOS: 96 tests, 164 s.
# Everything else runs in parallel. The first sharding run also made the treehouse acceptance binary
# exclusive: its 14 tests took 285 s one at a time on macOS, against 136 s for the same binary under
# `cargo test`. Its nested `cargo test -p cowfs-ctl --test admission` is the #79/#166 flake, so do not
# push this layout until #79 has landed.
[[profile.default.overrides]]
filter = 'package(cowfs-ctl)'
threads-required = "num-cpus"

# These measure descriptor and memory limits of the whole machine, so they must not overlap.
[test-groups]
machine-limits = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(resource_bounds)'
test-group = "machine-limits"
