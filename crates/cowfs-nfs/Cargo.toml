[package]
name = "cowfs-nfs"
description = "macOS mount adapter: serves a cowfs-vfs Vfs over an in-process NFSv3 loopback server and mounts it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
blake3.workspace = true
cowfs-vfs = { path = "../cowfs-vfs" }
nfsserve = { path = "../nfsserve" }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "signal"] }

[dev-dependencies]
cowfs-vfs-test = { path = "../cowfs-vfs-test" }
tempfile.workspace = true

[lints]
workspace = true
