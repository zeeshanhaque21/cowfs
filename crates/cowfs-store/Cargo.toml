[package]
name = "cowfs-store"
description = "Content-addressed block store for cowfs: chunking, hashing, compression, packs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version = "1.89"

[features]
fault-injection = []

[[example]]
name = "store-bench"
path = "examples/bench.rs"

[dependencies]
blake3.workspace = true
thiserror.workspace = true
fastcdc = "5"
zstd = "0.13"
crc32c = "0.6"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# A dev-dependency on itself, which is how a crate enables one of its own features for `cargo
# test` without CI having to pass `--features`. The crash-ordering tests are the proof that the
# discard ordering holds, so they run in the default configuration or they do not run at all.
cowfs-store = { path = ".", features = ["fault-injection"] }

[lints]
workspace = true
