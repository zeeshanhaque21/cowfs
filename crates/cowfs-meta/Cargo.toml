[package]
name = "cowfs-meta"
description = "Metadata for cowfs: redb-backed inode tables, Merkle tree, O(1) snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cowfs-store = { path = "../cowfs-store" }
blake3.workspace = true
redb = "4.3"
thiserror.workspace = true

[features]
# Test seam for cowfs-core: `Meta::set_commit_fault`. No production caller enables it
# (scripts/check-fault-seam-absent.sh guards it through cowfs-core).
fault-injection = []

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
