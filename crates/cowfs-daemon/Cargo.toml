[package]
name = "cowfs-daemon"
description = "The cowfs daemon: a Vfs backend, the control API and the platform mount adapter, wired into one process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[features]
# Issue 173: only forwards the store's process-exit seam (C7D_EXIT_BOUNDARY_N). It adds no code,
# no control-protocol surface and is never enabled by a default or release build; the harness
# builds a daemon with it into a private target dir. scripts/check-fault-seam-absent.sh guards it.
fault-injection = ["cowfs-store/fault-injection"]

[lib]
name = "cowfs_daemon"

[[bin]]
name = "cowfs-daemon"
path = "src/main.rs"

[dependencies]
cowfs-ctl = { path = "../cowfs-ctl" }
cowfs-core = { path = "../cowfs-core" }
cowfs-gc = { path = "../cowfs-gc" }
cowfs-store = { path = "../cowfs-store" }
cowfs-vfs = { path = "../cowfs-vfs" }
cowfs-vfs-path = { path = "../cowfs-vfs-path" }
cowfs-vfs-test = { path = "../cowfs-vfs-test" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cowfs-nfs = { path = "../cowfs-nfs" }

[target.'cfg(target_os = "linux")'.dependencies]
cowfs-fuse = { path = "../cowfs-fuse" }

[dev-dependencies]
cowfs-meta = { path = "../cowfs-meta" }
tempfile.workspace = true

[lints]
workspace = true
[[test]]
name = "guard"
path = "tests/guard/mod.rs"

[[test]]
name = "evidence"
path = "tests/evidence/mod.rs"
