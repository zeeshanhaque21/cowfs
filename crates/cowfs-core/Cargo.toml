[package]
name = "cowfs-core"
description = "cowfs core: the Vfs over the block store and the metadata tree, with a write-back layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Issue 173: records the mount root's durable writes (the swap intent file) for the power-loss model
# of tests/power_core.rs, and turns on the store's op log. No production caller enables it; the
# self dev-dependency below does it for this crate's tests. scripts/check-fault-seam-absent.sh
# guards it.
fault-injection = ["cowfs-store/fault-injection", "cowfs-meta/fault-injection"]

[dependencies]
cowfs-store = { path = "../cowfs-store" }
cowfs-gc = { path = "../cowfs-gc" }
cowfs-meta = { path = "../cowfs-meta" }
cowfs-snapname = { path = "../cowfs-snapname" }
cowfs-vfs = { path = "../cowfs-vfs" }
fs2 = "0.4"
thiserror.workspace = true

[dev-dependencies]
# A dev-dependency on itself, as the store does: `cargo test` gets the feature without `--features`.
cowfs-core = { path = ".", features = ["fault-injection"] }
cowfs-vfs-test = { path = "../cowfs-vfs-test" }
proptest.workspace = true
tempfile.workspace = true
redb = "4.3"
crc32c = "0.6"
libc = "0.2"

[lints]
workspace = true
