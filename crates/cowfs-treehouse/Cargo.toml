[package]
name = "cowfs-treehouse"
description = "The cowfs treehouse companion: mode (a) transparent mount checks and mode (b) snapshot-native slots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cowfs_treehouse"

[[bin]]
name = "cowfs-treehouse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
cowfs-ctl = { path = "../cowfs-ctl" }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
