[package]
name = "nfsserve"
description = "NFSv3 server library, vendored from huggingface/nfsserve 0.11.0 with cowfs patches (see PATCHES.md)"
version = "0.11.0"
edition.workspace = true
license = "BSD-3-Clause"
repository = "https://github.com/huggingface/nfsserve"
publish.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
byteorder = "1.4"
num-derive = "0.4"
num-traits = "0.2"
tokio = { version = "1", default-features = false, features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tracing = "0.1"

[lints]
workspace = true
